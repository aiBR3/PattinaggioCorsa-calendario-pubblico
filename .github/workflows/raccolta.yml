# Raccolta settimanale da fisr.info (Fase 2).
#
# Quando: ogni lunedì alle 05:17 UTC, oppure a mano da "Actions → Run workflow"
# (con la possibilità di indicare un intervallo di id da scandire e una data minima).
# Cosa: lancia gli script deterministici (raccogli_fisr.py → converti_fisr.py → genera_ics.py);
# se compaiono voci nuove in dati/eventi.yaml apre una pull request, che il proprietario
# rivede (nomi, luoghi, organizzatori, regola 10 di CLAUDE.md) e fonde a mano.
# Non scrive mai su main. Non giudica: le voci nuove hanno lo stato che converti_fisr.py
# sa dimostrare con il regolamento di gara (confermato/escluso) oppure da_verificare.
#
# Tracce (regola 5): i rapporti di ogni esecuzione sono allegati al job come artefatto;
# quando c'è una PR sono anche committati in registro/. Il riassunto del job dice cosa è successo.
#
# Requisiti una tantum (impostazioni del repository, le fa il proprietario):
#   Settings → Actions → General → Workflow permissions:
#   "Allow GitHub Actions to create and approve pull requests" attivo.
# Nota: le PR aperte con il token di Actions non fanno partire verifica.yml,
# perciò questo workflow esegue da sé genera_ics.py prima di aprire la PR.

name: Raccolta settimanale da fisr.info

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      scansione_da:
        description: "Primo id_manif da scandire (vuoto: calcolato dall'ultimo visto)"
        required: false
        default: ""
      scansione_a:
        description: "Ultimo id_manif da scandire (vuoto: ultimo visto + 300)"
        required: false
        default: ""
      data_minima:
        description: "Tiene solo le gare con data_inizio >= AAAA-MM-GG (vuoto: 14 giorni fa)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

# Una raccolta alla volta.
concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    name: Raccoglie, converte e apre la PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installa le dipendenze
        run: pip install -r script/requisiti.txt

      - name: Controlla se c'è già una PR di raccolta aperta
        id: pr_aperta
        run: |
          numero=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("raccolta/"))] | first | .number // empty')
          echo "numero=${numero}" >> "$GITHUB_OUTPUT"
          if [ -n "${numero}" ]; then
            echo "::notice::La PR #${numero} di una raccolta precedente è ancora aperta: questa esecuzione non ne aprirà un'altra."
          fi

      - name: Calcola i parametri della raccolta
        id: parametri
        env:
          SCANSIONE_DA: ${{ github.event.inputs.scansione_da }}
          SCANSIONE_A: ${{ github.event.inputs.scansione_a }}
          DATA_MINIMA: ${{ github.event.inputs.data_minima }}
        run: |
          set -euo pipefail
          oggi=$(date -u +%Y-%m-%d)
          if [ -n "${SCANSIONE_DA}" ] || [ -n "${SCANSIONE_A}" ]; then
            if ! [[ "${SCANSIONE_DA}" =~ ^[0-9]+$ && "${SCANSIONE_A}" =~ ^[0-9]+$ && "${SCANSIONE_DA}" -lt "${SCANSIONE_A}" ]]; then
              echo "::error::scansione_da e scansione_a vanno indicati entrambi, interi, con da < a (ricevuti '${SCANSIONE_DA}' e '${SCANSIONE_A}')"
              exit 1
            fi
            da="${SCANSIONE_DA}"; a="${SCANSIONE_A}"
          else
            read -r da a < <(python3 script/intervallo_scansione.py) || true
            if ! [[ "${da:-}" =~ ^[0-9]+$ && "${a:-}" =~ ^[0-9]+$ ]]; then
              echo "::error::intervallo_scansione.py non ha prodotto un intervallo valido (ricevuto '${da:-}' '${a:-}')"
              exit 1
            fi
          fi
          if [ -n "${DATA_MINIMA}" ]; then
            date -u -d "${DATA_MINIMA}" +%Y-%m-%d > /dev/null || { echo "::error::data_minima non è una data ISO: '${DATA_MINIMA}'"; exit 1; }
            data_minima="${DATA_MINIMA}"
          else
            data_minima=$(date -u -d "${oggi} -14 days" +%Y-%m-%d)
          fi
          {
            echo "oggi=${oggi}"
            echo "scansione_da=${da}"
            echo "scansione_a=${a}"
            echo "data_minima=${data_minima}"
          } >> "$GITHUB_OUTPUT"
          echo "Raccolta del ${oggi}: gare dal ${data_minima}, scansione dei regolamenti ${da}-${a}"

      - name: Raccolta grezza (lista + regolamenti di gara)
        run: >
          python3 script/raccogli_fisr.py
          --da "${{ steps.parametri.outputs.data_minima }}"
          --regolamenti
          --scansione-regolamenti ${{ steps.parametri.outputs.scansione_da }} ${{ steps.parametri.outputs.scansione_a }}
          --pausa 0.3
          --uscita "registro/${{ steps.parametri.outputs.oggi }}-raccolta-fisr.json"

      - name: Conversione in voci di eventi.yaml
        run: >
          python3 script/converti_fisr.py
          --raccolta "registro/${{ steps.parametri.outputs.oggi }}-raccolta-fisr.json"
          --rapporto "registro/${{ steps.parametri.outputs.oggi }}-conversione-fisr.md"
          --scrivi

      - name: Genera e verifica il calendario con i dati nuovi
        run: >
          python3 script/genera_ics.py
          --ingresso dati/eventi.yaml
          --uscita uscita
          --url-base https://aibr3.github.io/PattinaggioCorsa-calendario-pubblico

      - name: Allega i rapporti al job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raccolta-${{ steps.parametri.outputs.oggi || 'senza-data' }}
          path: |
            registro/*-raccolta-fisr.json
            registro/*-conversione-fisr.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Controlla se ci sono voci nuove
        id: novita
        run: |
          if git diff --quiet -- dati/eventi.yaml; then
            echo "nuove=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna voce nuova in dati/eventi.yaml."
          else
            echo "nuove=true" >> "$GITHUB_OUTPUT"
            echo "Voci nuove in dati/eventi.yaml: $(git diff --numstat -- dati/eventi.yaml)"
          fi

      - name: Apre la pull request
        if: steps.novita.outputs.nuove == 'true' && steps.pr_aperta.outputs.numero == ''
        env:
          OGGI: ${{ steps.parametri.outputs.oggi }}
          DATA_MINIMA: ${{ steps.parametri.outputs.data_minima }}
          SCANSIONE_DA: ${{ steps.parametri.outputs.scansione_da }}
          SCANSIONE_A: ${{ steps.parametri.outputs.scansione_a }}
        run: |
          set -euo pipefail
          ramo="raccolta/${OGGI}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${ramo}"
          git add dati/eventi.yaml "registro/${OGGI}-raccolta-fisr.json" "registro/${OGGI}-conversione-fisr.md"
          git commit -m "Aggiunge le gare trovate su fisr.info il ${OGGI}" \
            -m "Raccolta settimanale automatica (workflow raccolta.yml): gare dal ${DATA_MINIMA}, regolamenti di gara ${SCANSIONE_DA}-${SCANSIONE_A}. Le voci esistenti non sono state toccate."
          git push origin "${ramo}"
          {
            echo "## Cosa cambia"
            echo
            echo "Raccolta automatica del ${OGGI} (workflow \`raccolta.yml\`): voci nuove proposte da \`converti_fisr.py\` in \`dati/eventi.yaml\`; le voci esistenti non sono state toccate. \`genera_ics.py\` ha generato il calendario senza errori."
            echo
            echo "**Prima del merge** (regola 10 di \`CLAUDE.md\`): rivedere nomi, luoghi e organizzatori delle voci nuove; per ogni voce cercare il sito dell'organizzatore e completare link, distanze e note; le voci \`da_verificare\` restano tali finché non c'è una prova."
            echo
            echo "## Fonti"
            echo
            echo "fisr.info: lista della stagione corrente (gare dal ${DATA_MINIMA}) e regolamenti di gara linkati più la scansione degli id ${SCANSIONE_DA}-${SCANSIONE_A}. Dettagli nel rapporto qui sotto e in \`registro/${OGGI}-raccolta-fisr.json\`."
            echo
            echo "## Cosa resta in dubbio"
            echo
            echo "Tutto ciò che il rapporto elenca come \`da_verificare\` o come differenza rispetto a voci esistenti."
            echo
            echo "## Rapporto di conversione"
            echo
            cat "registro/${OGGI}-conversione-fisr.md"
          } > /tmp/corpo_pr.md
          gh pr create --base main --head "${ramo}" \
            --title "Aggiunge le gare trovate su fisr.info il ${OGGI}" \
            --body-file /tmp/corpo_pr.md

      - name: Riassunto
        if: always()
        env:
          NUOVE: ${{ steps.novita.outputs.nuove }}
          PR_APERTA: ${{ steps.pr_aperta.outputs.numero }}
          OGGI: ${{ steps.parametri.outputs.oggi }}
        run: |
          {
            echo "### Raccolta del ${OGGI:-?}"
            if [ "${NUOVE}" = "true" ] && [ -z "${PR_APERTA}" ]; then
              echo "Voci nuove: **sì**, pull request aperta sul ramo \`raccolta/${OGGI}\`."
            elif [ "${NUOVE}" = "true" ]; then
              echo "Voci nuove: **sì**, ma la PR #${PR_APERTA} è ancora aperta: nessuna nuova PR. I rapporti sono nell'artefatto del job; la prossima esecuzione le riproporrà."
            elif [ "${NUOVE}" = "false" ]; then
              echo "Voci nuove: nessuna. Rapporti nell'artefatto del job."
            else
              echo "Esecuzione interrotta prima della conversione: vedere i passi in rosso e l'artefatto (se c'è)."
            fi
            if [ -f "registro/${OGGI}-conversione-fisr.md" ]; then
              echo
              echo "<details><summary>Rapporto di conversione</summary>"
              echo
              cat "registro/${OGGI}-conversione-fisr.md"
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
