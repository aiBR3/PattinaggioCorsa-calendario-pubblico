  note: "Partenza ore 9.00. Maratona di 42 km per Junior, Senior e Master; mezza maratona di 21 km per Allievi e Fitness, con partenza ad Aviano e navetta compresa nella quota. Quota 25 € per tutte le categorie. Iscrizione con i link di pagamento sulla pagina dell'organizzatore, indicando nelle note data di nascita e telefono (e, per la 21 km, se si usa la navetta)."
  note_interne: "Master dal titolo ufficiale FISR; Fitness dalla pagina dell'organizzatore (decisione 2026-11-06). Regolamento del campionato non letto: il 'REGOLAMENTO' sulla pagina dell'organizzatore è un'immagine, non leggibile da script. Il menu del sito punta a /campionati-italiani-maratona-2026, che è vuota: la pagina buona resta quella con '2025' nell'indirizzo. La pagina chiama la gara 'TriRoller Race 2025/26/27'. Scadenza iscrizioni presa dalla lista FISR."

