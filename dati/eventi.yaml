  stato: non_autorizzato
  fonti:
    - url: https://www.fisr.info/attivita/corsa_calendario.php
      letto_il: 2026-11-16
    - url: https://www.fisr.info/attivita/corsa_trofeo_modulo.php?id_manif=7073
      letto_il: 2026-11-16
  verificato_il: 2026-11-16
  prova: "Regolamento di gara id_manif 7073, art. 10 'Programma gare': righe 'MASTER OVER 75 | F | 5000 m | In linea'; 'MASTER OVER 75 | M | 5000 m | In linea' e seguenti. Categorie elencate: MASTER OVER 75, MASTER OVER 70, MASTER OVER 65, MASTER OVER 60, MASTER OVER 55, MASTER OVER 50, MASTER OVER 45, MASTER OVER 40, MASTER OVER 35, MASTER OVER 30."
  note: "Manifestazione di categoria B su pista. Campo di gara: Pista di pattinaggio con curve soprelevate pendenza costante mt 150 alla corda larghezza mt 5.50 con rivestimento VESMACO Tutte le gare si effettueranno esclusivamente in pista soprelevata. Il sabato mattina sarà possibi…"
  note_interne: "Nella lista FISR compare come 'Attività non ancora autorizzata' (il regolamento esiste già). Sostituisce la voce 2027-05-29-laquila-internazionali-ditalia-open-indoor, esclusa il 2026-11-05: allora il regolamento 7073 era di un solo giorno (29/05), con iscrizioni entro il 26/05 e le sole categorie Allievi, Ragazzi, Ragazzi 12, Esordienti, Giovanissimi. Tra il 2026-11-09 e il 2026-11-16 l'organizzatore ha cambiato il regolamento: 28-29/05, iscrizioni entro il 24/05, aggiunte le righe Master Over 30-75 (5000 m in linea); la lista federale riporta le stesse date. La vecchia voce non era mai stata pubblicata (esclusa): nella revisione a mano della PR #55 (2026-11-16) è stata tolta e resta questa, con l'id della nuova data d'inizio. Il regolamento rimanda a https://cpga.net/iio per disposizioni e orari. Il sito dell'organizzatore (cpga.net, sito_verificato nel registro) al 2026-11-17 elenca solo le edizioni 2026 (Internazionali corsa 25-27/09/2026, Memorial Cacciani 5-6/12/2026): nessuna pagina dell'edizione di maggio 2027, nessun dato copiato; url_ufficiale resta il regolamento FISR (non sostituito con la home: decide il proprietario). Arricchimento 2026-11-17: sito trovato, pagina dell'evento assente (registro); ricerche: nessuna; pagine: https://cpga.net/, https://cpga.net/iio/, https://cpga.net/iio/iio-corsa/, https://cpga.net/iio/memorial-cacciani/."

