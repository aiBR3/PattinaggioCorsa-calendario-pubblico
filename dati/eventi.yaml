  note_interne: "Nel calendario fisr.info compare come 'Attività non ancora autorizzata' e senza link, ma il regolamento di gara (id_manif 7047, manifestazione di categoria B su pista) esiste già e prevede le categorie Master: da ricontrollare quando arriva l'autorizzazione. I giornali (2023) citano accanto agli Internazionali un Campionato Nazionale CSEN: possibile gara promozionale, da verificare su una fonte ufficiale. Aggiornata il 2026-11-23 da converti_fisr.py, il regolamento di gara id_manif 7047 è cambiato: date 2026-12-06–2026-12-06 → 2027-02-14–2027-02-14; id 2026-12-06-laquila-internazionali-open-indoor-master-race → 2027-02-14-laquila-internazionali-open-indoor-master-race; scadenza iscrizioni 2026-11-30 → 2027-02-09. Nome aggiornato il 2026-11-23 da converti_fisr.py perché la lista federale ha cambiato il titolo: da «INTERNAZIONALI D'ITALIA OPEN INDOOR - MASTER RACE - Vesmaco Race VI Memorial Romano Maria Cacciani» a «MASTER RACE - INTERNAZIONALI D'ITALIA OPEN INDOOR - Vesmaco Race VII Memorial Romano Maria Cacciani»; il nome della voce era «Internazionali d'Italia Open Indoor — Master Race — Vesmaco Race, VI Memorial Romano Maria Cacciani». Arricchimento 2026-11-24: sito non raggiungibile (registro: cpga.net, 502 dalla shell); il regolamento 7047 riletto oggi ha le righe Master solo da Over 30 a Over 60 (prima arrivava a Over 75) e aggiunge Allievi, Ragazzi, Ragazzi 12, Esordienti, Giovanissimi: prova aggiornata; iscrizioni entro il 09/02/27, conferme entro il 10/02/27; il regolamento rimanda a https://cpga.net/iio per orari e variazioni; ricerche: nessuna; pagine: https://cpga.net/, https://www.fisr.info/attivita/corsa_trofeo_modulo.php?id_manif=7047."

