      letto_il: 2026-11-06
  verificato_il: 2026-11-06
  prova: "World Skate Marathon Tour 2026, Naples Challenger Stage, Bulletin #1 del 2026-06-17 (PDF sul sito dell'organizzatore): copertina 'Pro, Master & Amateur Category'; programma del 31 ottobre: '8:30am Pro & Master Women 42km', '10:30am Pro & Master Men 42km', '1:00pm Amateurs 20km'; categorie Master 30 (30 to 34) … Master 75 (75+), età al 31 dicembre 2026. Pagina amatori dell'organizzatore: 'Percorso: 5 giri completi per un totale di 20 km'."
  note: "Tappa Challenger del World Skate Marathon Tour, dentro il Roller Skating Festival di Napoli (30 ottobre - 1 novembre). Pro e Master: 42 km, categorie Master a scatti di 5 anni dai 30 ai 75+, iscrizione su World Skate Infinity dal 22/07 al 22/10/2026, quota 70 USD. Amatori: 20 km con partenza alle 13.00, quota 60 €, iscrizione con il modulo e il bonifico indicati sulla pagina dell'organizzatore. Accrediti venerdì 30 e sabato 31 mattina."
  note_interne: "Assente dalla lista fisr.info: segnalato dal proprietario, trovato poi dal sito dell'organizzatore e dalla pagina eventi di World Skate. Una voce sola per le due gare dello stesso giorno (decisione 2026-11-06). La pagina amatori contiene un IBAN e un numero di cellulare: non copiarli nel repository. Il festival comprende altre discipline (freestyle, roller cross, ecc.): fuori dal calendario. Scadenza iscrizioni: quella di World Skate Infinity (Pro/Master); per gli amatori la pagina non indica una scadenza."

