- id: 2026-09-26-berlino-bmw-berlin-marathon-inlineskating
  nome: "BMW Berlin-Marathon Inlineskating"
  data_inizio: 2026-09-26
  data_fine: 2026-09-26
  luogo: "Berlino, percorso della maratona con arrivo alla Porta di Brandeburgo"
  paese: DE
  tipo: gara
  categorie: ["master", "amatori"]
  distanze: ["maratona 42,195 km"]
  organizzatore: "SCC EVENTS"
  url_ufficiale: "https://www.bmw-berlin-marathon.com/en/"
  url_iscrizione: ""
  scadenza_iscrizione: 2026-08-27
  stato: confermato
  fonti:
    - url: https://web.archive.org/web/20260927155139/https://www.bmw-berlin-marathon.com/en/registration/inlineskating
      letto_il: 2026-11-06
    - url: https://www.scc-events.com/en/events/calendar
      letto_il: 2026-11-06
  verificato_il: 2026-11-06
  prova: "Pagina ufficiale di iscrizione (copia Wayback del 2026-09-27), sezione 'Eligibility': 'all inline skater year 2009 and older are allowed to participate'; gara organizzata secondo il regolamento (WKO) della federazione tedesca DRIV. Aperta a tutti i nati nel 2009 o prima, senza obbligo di categoria agonistica: Master e amatori ammessi (decisione 2026-11-06)."
  note: "Partenza dalle 12:20 a ondate. Limite di tempo 2:10 h; casco obbligatorio; solo pattini in linea (ruote max 125 mm) e quad. Iscrizioni dal 26/02 al 27/08/2026 (o fino a esaurimento), quota 99-119 €."
  note_interne: "La pagina ufficiale dell'edizione 2026 è stata tolta dopo la gara (skating.bmw-berlin-marathon.com e /en/registration/inlineskating → 404): letta dalla Wayback Machine. Edizione 2027 (Generali Berlin-Marathon, 26/09/2027): il calendario SCC Events e la pagina 'Disciplines' del nuovo sito elencano solo corsa, handbike e carrozzina, nessuna gara inline; nessun annuncio esplicito trovato (2026-11-06). Ricontrollare prima di creare la voce 2027."

