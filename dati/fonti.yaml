- id: pattiniamolitalia-eventi
  nome: "Pattiniamo l'Italia — eventi"
  url: https://calendar.google.com/calendar/ical/7bpemuo7vdilljftkjo7iru42c%40group.calendar.google.com/public/basic.ics
  paese: IT
  metodo: script
  frequenza: settimanale
  copre: [pattinate]
  affidabilita: aggregatore
  stato: attiva
  note: "Attiva dal 2026-11-22: la legge script/converti_pattinate.py ogni lunedì dentro raccolta.yml (decisioni del 2026-11-22 in appunti/decisioni.md). La pagina https://www.pattiniamolitalia.it/eventi/ incorpora un Google Calendar pubblico: l'indirizzo registrato qui è il suo file ICS, che risponde come text/calendar. Il 2026-11-22 conteneva 243 eventi dal 2021, 41 dei quali futuri (dal 06/12/2026 al 05/12/2027): sono le pattinate non competitive del movimento, una quarantina all'anno, con il titolo nella forma 'PPUG - luogo o nome - gruppo che organizza'. Limiti: solo le date (giornate intere, da uno a quattro giorni, senza orario né luogo nel campo apposito); 37 dei 41 eventi futuri non hanno descrizione; l'ultima parte del titolo nomina spesso le persone che organizzano, e lo script non la copia, come non legge le descrizioni (regola 9); alcune uscite sono fuori perimetro (Varsavia, Budapest) e alcuni eventi non sono pattinate (la maratona di Berlino, il Meeting del movimento): restano in eventi.yaml come escluso; gli annullamenti sono scritti nel titolo ('ANNULLATA - …', 5 casi nello storico). È il calendario di chi organizza le pattinate: affidabile per le date, non per i dettagli; per questo le voci entrano come annunciato, non come confermato. Il sito ha anche un plugin di eventi WordPress, ma la sua API non restituisce eventi."
  ultimo_controllo: 2026-11-22

