- id: fisr-it-comunicati
  nome: "FISR.it — comunicati ufficiali corsa"
  url: https://www.fisr.it/corsa/comunicati-ufficiali.html
  paese: IT
  metodo: script
  frequenza: settimanale
  copre: [gare, verifica]
  affidabilita: ufficiale
  stato: da_verificare
  note: "Letta il 2026-11-17. La pagina indice elenca gli anni (2013-2026) con il numero di comunicati; ogni anno ha una pagina (2026: /corsa/comunicati-ufficiali/category/601-2026.html, 43 comunicati) con titolo e link di scaricamento '?download=NUMERO:titolo' (PDF). I titoli dicono già gara, categorie, luogo e date: nel 2026 il Campionato Italiano maratona cat. J/S/M (CU 19 e 24), il Campionato Italiano su strada cat. A/J/S/M (CU 37 e 38), le precisazioni sulle norme per il Campionato Italiano su strada Master (CU 17 e 31), la tappa di Napoli del World Skate Marathon Tour (CU 43). Aperto il CU 37: dà la società organizzatrice ('ORGANIZZAZIONE'), l'impianto, le scadenze di iscrizione, le gare previste per categoria (Master: 5.000 e 10.000 m in linea) e il sito dell'organizzatore. È ciò che manca per i campionati futuri, dove la lista federale dice solo 'FISR'. Attenzione: i comunicati contengono nomi e telefoni di persone, che non si copiano (regola 9); il testo estratto dai PDF ha le lettere spaziate in alcuni titoli. Nella stessa sezione, /corsa/regolamenti.html ha le norme per l'attività e il regolamento tecnico della stagione. Proposta: prima fonte da attivare; uno script legge l'indice dell'anno e segnala i comunicati nuovi, l'arricchimento apre il PDF della gara. Dal 2026-11-26 la prima metà è in funzione: script/raccogli_comunicati.py elenca i comunicati ogni lunedì in dati/comunicati.yaml, dentro raccolta.yml, senza aprirli (come legge la pagina: script/LEGGIMI.md); la fonte passa ad attiva quando l'arricchimento li leggerà."
  ultimo_controllo: 2026-11-26

