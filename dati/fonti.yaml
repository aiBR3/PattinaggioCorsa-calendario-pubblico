- id: scc-events-calendario
  nome: "SCC EVENTS (Berlino) — calendario degli eventi"
  url: https://www.scc-events.com/en/events/calendar
  paese: DE
  metodo: script
  frequenza: mensile
  copre: [gare]
  affidabilita: organizzatore
  stato: attiva
  note: "Organizzatore della Berlin-Marathon, della Berlin Half Marathon e della City Night: la pagina elenca ogni evento con data, distanza e disciplina ('Inline skating') e offre un file .ics di tutti gli eventi. Nel 2027: Half Marathon Inlineskating 04/04 (21 km), City Night Inlineskating 31/07 (10 km); la maratona 26/09/2027 non elenca l'inline. Le pagine di iscrizione (generali-berliner-halbmarathon.de, berlin-citynight.de) contengono la frase di ammissione ('Jahrgänge … und älter'): la versione tedesca è quella da citare, l'inglese a volte è tradotto male. Le pagine dell'edizione passata vengono tolte subito dopo la gara: leggerle in tempo o dalla Wayback Machine."
  ultimo_controllo: 2026-11-06

